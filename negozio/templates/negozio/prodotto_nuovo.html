<!DOCTYPE html>
<html lang="it">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aggiungi Nuovo Prodotto</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

    <div class="container py-5">
        <a href="{% url 'home' %}" class="btn btn-outline-secondary mb-4">← Annulla e Torna alla Home</a>

        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card shadow border-0 p-4">
                    <h2 class="text-primary fw-bold mb-4 text-center">Aggiungi un Prodotto</h2>

                    <form method="POST">
                        {% csrf_token %} <div class="mb-3">
                            <label class="form-label fw-bold">Nome Prodotto</label>
                            {{ form.nome }}
                        </div>

                        <div class="mb-3">
                            <label class="form-label fw-bold">Descrizione</label>
                            {{ form.descrizione }}
                        </div>

                        <div class="mb-3">
                            <label class="form-label fw-bold">Prezzo (€)</label>
                            {{ form.prezzo }}
                        </div>

                        <button type="submit" class="btn btn-success w-100 py-2 mt-3 rounded-pill fw-bold">Salva
                            Prodotto</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

</body>

</html>
