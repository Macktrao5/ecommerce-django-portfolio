{% extends 'negozio/base.html' %}

{% block content %}
<div class="container my-5 pt-4">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card shadow-sm border-0 p-4">
                <h2 class="fw-bold mb-4">👤 Il tuo Profilo</h2>

                <div class="mb-3">
                    <label class="form-label text-muted">Nome utente</label>
                    <p class="fs-5 fw-semibold">{{ request.user.username }}</p>
                </div>

                <div class="mb-3">
                    <label class="form-label text-muted">Email</label>
                    <p class="fs-5 fw-semibold">{{ request.user.email|default:"Non impostata" }}</p>
                </div>

                <div class="mb-4">
                    <label class="form-label text-muted">Data di registrazione</label>
                    <p class="fs-5 fw-semibold">{{ request.user.date_joined|date:"d/m/Y H:i" }}</p>
                </div>

                <div class="d-flex gap-3">
                    <a href="{% url 'storico_ordini' %}" class="btn btn-dark">📦 Vai ai tuoi ordini</a>
                    <a href="{% url 'logout' %}" class="btn btn-outline-danger">Esci dall'account</a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
